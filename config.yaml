llm:
  backend: "llamacpp"
  base_url: "http://192.168.1.81:11434"
  model: "qwen2.5:7b"
  llamacpp_base_url: "http://192.168.1.81:8080"
  llamacpp_model_path: ""
  llamacpp_n_ctx: 4096
  llamacpp_n_threads: 0
  llamacpp_n_gpu_layers: 0
  temperature: 0.1
  timeout_seconds: 90
  retry_count: 2

discovery:
  max_depth: 3
  include_hidden: false
  exclude_dirs:
    - ".git"
    - ".venv"
    - "venv"
    - "env"
    - "ENV"
    - "node_modules"
    - "dist"
    - "build"
    - "__pycache__"
    - ".mypy_cache"
    - ".pytest_cache"
    - ".idea"
    - ".vscode"
  project_markers:
    - ".git"
    - "pyproject.toml"
    - "requirements.txt"
    - "package.json"
    - "Dockerfile"
    - "docker-compose.yml"
    - "docker-compose.yaml"
    - "Makefile"
    - "app.py"
    - "main.py"
    - "manage.py"

scanner:
  max_files: 12
  max_file_chars: 3500
  max_total_chars: 28000
  max_tree_entries: 250
  max_tree_depth: 4
  tree_mode: "system_auto"
  tree_timeout_seconds: 8
  exclude_dirs:
    - ".git"
    - ".venv"
    - "venv"
    - "env"
    - "ENV"
    - ".tox"
    - ".nox"
    - ".direnv"
    - "node_modules"
    - "dist"
    - "build"
    - "__pycache__"
    - ".mypy_cache"
    - ".pytest_cache"
    - ".idea"
    - ".vscode"
  important_file_patterns:
    - "app.py"
    - "main.py"
    - "manage.py"
    - "server.py"
    - "api.py"
    - "settings.py"
    - "routes.py"
    - "requirements.txt"
    - "pyproject.toml"
    - "package.json"
    - "Dockerfile"
    - "docker-compose*.yml"
    - "docker-compose*.yaml"
    - "Makefile"
    - ".env.example"
    - "README.md"
    - "README.rst"
    - ".gitignore"
    - ".readme-rebuilderignore"

output:
  readme_name: "README.generated.md"
  report_dir: ".readme_rebuilder"
  save_analysis_json: true
  persist_source_snippets: false
  redact_secrets: true
  write_atomically: true
  save_readme_diff: true
  diff_context_lines: 3

batch:
  concurrency: 2
